<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>平組 社内相談 管理</title>
<style>
:root{--bg:#0b0e0c;--card:#151a17;--line:#334039;--text:#f4f7f5;--muted:#9caaa2;--accent:#d8eadf;--dark:#102017}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090b0a,#101612);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:12px}.logo{width:64px;height:64px;border-radius:14px;background:#fff;object-fit:contain;padding:5px}.brand{font-size:12px;letter-spacing:.11em}.corp{font-size:21px;font-weight:850}.card{margin-top:18px;background:rgba(21,26,23,.98);border:1px solid var(--line);border-radius:18px;padding:18px}.login{max-width:470px;margin:70px auto}.login h1{margin-top:0}.pin{width:100%;padding:15px;border-radius:12px;background:#0c120f;border:1px solid #3a4a41;color:#fff;font-size:20px;letter-spacing:.12em}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:12px;background:var(--accent);color:var(--dark)}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar h1{font-size:25px;margin:0}.refresh{background:#27332c;color:#fff}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}.list{max-height:70vh;overflow:auto}.case{padding:12px;border:1px solid #314039;border-radius:12px;margin-bottom:8px;cursor:pointer;background:#0f1512}.case:hover,.case.active{border-color:#9ab7a7;background:#152019}.caseId{font-weight:850}.meta{font-size:11px;color:var(--muted);margin-top:5px}.badge{display:inline-block;padding:3px 7px;border:1px solid #45564d;border-radius:999px;margin-left:6px}.detail{min-height:420px}.content{white-space:pre-wrap;background:#0b110e;border:1px solid #334239;border-radius:13px;padding:15px;line-height:1.8;margin-top:12px}.row{margin-top:10px;color:#d5ddd8}.row b{color:#fff}.status{background:#0e1511;color:#fff;border:1px solid #405047;border-radius:9px;padding:8px}.empty{color:var(--muted);padding:30px;text-align:center}.err{color:#ffaaa4;margin-top:9px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:36vh}.wrap{padding:11px}}
</style></head><body><div class="wrap">
<div class="head"><img class="logo" src="https://hiragumi.rac-solution.com/wp-content/uploads/2026/10/平組流ロゴ.png"><div><div class="brand">HIRAGUMI / EMPLOYEE SUPPORT</div><div class="corp">有限会社 平組　相談管理</div></div></div>
<section id="login" class="card login"><h1>管理者ログイン</h1><div style="color:#aeb9b2;font-size:13px">管理PINを入力してください。</div><input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="one-time-code"><button id="loginBtn" class="btn primary">ログイン</button><div id="loginErr" class="err"></div></section>
<section id="app" class="hidden"><div class="card"><div class="toolbar"><div><h1>相談一覧</h1><div id="count" class="meta"></div></div><button id="refresh" class="btn refresh">更新</button></div><div class="grid"><div id="list" class="list"></div><div id="detail" class="detail card" style="margin-top:0"><div class="empty">相談を選択してください。</div></div></div></div></section>
</div><script>
const $=x=>document.getElementById(x);let cases=[],selected='';
async function login(){ $('loginErr').textContent='';const r=await fetch('/api/counsel-admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});if(!r.ok){$('loginErr').textContent='PINが違います。';return}await load()}
async function load(){const r=await fetch('/api/counsel-admin-cases',{cache:'no-store'});if(r.status===401){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const d=await r.json();cases=d.cases||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');$('count').textContent=cases.length+'件';renderList();if(selected){const c=cases.find(x=>x.consultationId===selected);if(c)renderDetail(c)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function subject(v){return({unknown:'わからない・その他',coworker:'同僚',leader:'職長・リーダー',manager:'管理職',officer:'役員',vice_president:'副社長',president:'社長',company:'会社・制度全体'})[v]||v}
function renderList(){if(!cases.length){$('list').innerHTML='<div class="empty">まだ相談はありません。</div>';return}$('list').innerHTML=cases.map(c=>'<div class="case '+(c.consultationId===selected?'active':'')+'" data-id="'+esc(c.consultationId)+'"><div class="caseId">'+esc(c.consultationId)+' <span class="badge">'+esc(c.status||'未確認')+'</span></div><div class="meta">'+esc(new Date(c.receivedAt).toLocaleString('ja-JP'))+' / '+esc(c.identityMode==='named'?'記名':'匿名')+' / '+esc(subject(c.subjectLevel))+'</div></div>').join('');document.querySelectorAll('.case').forEach(el=>el.onclick=()=>{selected=el.dataset.id;renderList();renderDetail(cases.find(x=>x.consultationId===selected))})}
function renderDetail(c){if(!c)return;$('detail').innerHTML='<div class="caseId">'+esc(c.consultationId)+'</div><div class="row"><b>受付:</b> '+esc(new Date(c.receivedAt).toLocaleString('ja-JP'))+'</div><div class="row"><b>言語:</b> '+esc(c.languageName||c.languageCode)+'</div><div class="row"><b>相談方法:</b> '+esc(c.identityMode==='named'?'記名':'匿名')+(c.employeeName?' / '+esc(c.employeeName):'')+'</div><div class="row"><b>所属・現場:</b> '+esc(c.affiliation||'—')+'</div><div class="row"><b>相談対象:</b> '+esc(subject(c.subjectLevel))+'</div><div class="row"><b>共有してほしくない相手:</b> '+esc(c.shareAvoid||'—')+'</div><div class="row"><b>対応状況:</b> <select id="status" class="status"><option>未確認</option><option>確認済</option><option>対応中</option><option>対応済</option></select></div><div class="content">'+esc(c.content)+'</div>'
  +(c.improveIdea?'<div class="row" style="margin-top:18px"><b>あなたはどうすればよくなると考えるか</b></div><div class="content">'+esc(c.improveIdea)+'</div>':'')
  +(c.selfAction?'<div class="row" style="margin-top:18px"><b>あなたにできることは何か</b></div><div class="content">'+esc(c.selfAction)+'</div>':''); $('status').value=c.status||'未確認';$('status').onchange=async()=>{const status=$('status').value;const r=await fetch('/api/counsel-admin-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consultationId:c.consultationId,status})});if(r.ok){c.status=status;renderList()}}}
$('loginBtn').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};$('refresh').onclick=load;load();
</script></body></html>
