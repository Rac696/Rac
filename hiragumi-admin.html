<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>平組 社内相談 管理</title>
<style>
:root{--bg:#0b0e0c;--card:#151a17;--line:#334039;--text:#f4f7f5;--muted:#9caaa2;--accent:#d8eadf;--dark:#102017}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#090b0a,#101612);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}.head{display:flex;align-items:center;gap:12px}.logo{width:64px;height:64px;border-radius:14px;background:#fff;object-fit:contain;padding:5px}.brand{font-size:12px;letter-spacing:.11em}.corp{font-size:21px;font-weight:850}.card{margin-top:18px;background:rgba(21,26,23,.98);border:1px solid var(--line);border-radius:18px;padding:18px}.login{max-width:470px;margin:70px auto}.login h1{margin-top:0}.pin{width:100%;padding:15px;border-radius:12px;background:#0c120f;border:1px solid #3a4a41;color:#fff;font-size:20px;letter-spacing:.12em}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;cursor:pointer}.primary{width:100%;margin-top:12px;background:var(--accent);color:var(--dark)}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.toolbar h1{font-size:25px;margin:0}.refresh{background:#27332c;color:#fff}.grid{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:14px}.list{max-height:70vh;overflow:auto}.case{padding:12px;border:1px solid #314039;border-radius:12px;margin-bottom:8px;cursor:pointer;background:#0f1512}.case:hover,.case.active{border-color:#9ab7a7;background:#152019}.caseId{font-weight:850}.meta{font-size:11px;color:var(--muted);margin-top:5px}.badge{display:inline-block;padding:3px 7px;border:1px solid #45564d;border-radius:999px;margin-left:6px}.detail{min-height:420px}.content{white-space:pre-wrap;background:#0b110e;border:1px solid #334239;border-radius:13px;padding:15px;line-height:1.8;margin-top:12px}.row{margin-top:10px;color:#d5ddd8}.row b{color:#fff}.status{background:#0e1511;color:#fff;border:1px solid #405047;border-radius:9px;padding:8px}.empty{color:var(--muted);padding:30px;text-align:center}.err{color:#ffaaa4;margin-top:9px}.handlingBox{margin-top:16px;padding:14px;border:1px solid #4a5a51;border-radius:13px;background:#101713}.handlingBox label{display:block;font-size:12px;margin:10px 0 6px;color:#dce5e0}.handlingBox select,.handlingBox textarea{width:100%;background:#0b110e;color:#fff;border:1px solid #405047;border-radius:9px;padding:10px;font-size:14px}.handlingBox textarea{min-height:90px;resize:vertical}.saveHandling{margin-top:10px;background:#d8eadf;color:#102017;width:100%}.history{font-size:12px;color:#bfcac4;margin-top:10px;white-space:pre-wrap}
@media(max-width:760px){.grid{grid-template-columns:1fr}.list{max-height:36vh}.wrap{padding:11px}}
</style></head><body><div class="wrap">
<div class="head"><img class="logo" src="https://hiragumi.rac-solution.com/wp-content/uploads/2026/10/平組流ロゴ.png"><div><div class="brand">HIRAGUMI / EMPLOYEE SUPPORT</div><div class="corp">有限会社 平組　相談管理</div><div class="brand" style="margin-top:3px;opacity:.55">v2</div></div></div>
<section id="login" class="card login"><h1>管理者ログイン</h1><div style="color:#aeb9b2;font-size:13px">管理PINを入力してください。</div><input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="one-time-code"><button id="loginBtn" class="btn primary">ログイン</button><div id="loginErr" class="err"></div></section>
<section id="app" class="hidden"><div class="card"><div class="toolbar"><div><h1>相談一覧</h1><div id="count" class="meta"></div></div><button id="refresh" class="btn refresh">更新</button></div><div class="grid"><div id="list" class="list"></div><div id="detail" class="detail card" style="margin-top:0"><div class="empty">相談を選択してください。</div></div></div></div></section>
</div><script>
const APP_VERSION='2026-10-08-share-v2';const $=x=>document.getElementById(x);let cases=[],selected='';const translating=new Set();
async function login(){ $('loginErr').textContent='';const r=await fetch('/api/counsel-admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:$('pin').value})});if(!r.ok){$('loginErr').textContent='PINが違います。';return}await load()}
async function load(){const r=await fetch('/api/counsel-admin-cases',{cache:'no-store'});if(r.status===401){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const d=await r.json();cases=d.cases||[];$('login').classList.add('hidden');$('app').classList.remove('hidden');$('count').textContent=cases.length+'件';renderList();if(selected){const c=cases.find(x=>x.consultationId===selected);if(c)renderDetail(c)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function subject(v){return({unknown:'わからない・その他',coworker:'同僚',leader:'職長・リーダー',manager:'管理職',officer:'役員',vice_president:'副社長',president:'社長',company:'会社・制度全体'})[v]||v}
function shareScopeLabel(v,version){if(v==='external_only')return version==='v2_confirm_before_company_share'?'まずは外部相談対応者のみ／本人確認後に共有可':'旧設定：外部相談対応者のみ・会社側共有不可';return({anonymized:'本人特定情報を伏せれば必要担当者へ共有可',summary_only:'要旨のみ共有可',confirm_first:'共有前に本人確認が必要'})[v]||'本人特定情報を伏せれば必要担当者へ共有可'}
function avoidTypeLabel(v){return({direct_supervisor:'直属上司',subject_person:'相談対象者本人',specific_executive:'特定の役員',other:'その他'})[v]||''}
function consultationCategoryLabel(v){return({safety_harassment:'安全・暴力・重大なハラスメント等',labor_rules:'労働条件・勤務・賃金・会社ルール',relationship:'人間関係・指示のされ方',workplace_improvement:'現場・設備・教育・情報共有の改善',company_proposal:'会社への提案・改善案',personal_request:'個人的な希望・待遇に関する要望',other:'その他'})[v]||'その他'}
function handlingTypeLabel(v){return({priority_action:'優先確認・対応',fact_check:'事実確認・会社判断',advice_coordination:'助言・調整',org_improvement:'組織改善として検討',record_opinion:'意見として記録',out_of_scope:'対応対象外'})[v]||'未判断'}
function renderList(){if(!cases.length){$('list').innerHTML='<div class="empty">まだ相談はありません。</div>';return}$('list').innerHTML=cases.map(c=>'<div class="case '+(c.consultationId===selected?'active':'')+'" data-id="'+esc(c.consultationId)+'"><div class="caseId">'+esc(c.consultationId)+' <span class="badge">'+esc(c.status||'未確認')+'</span>'+(c.shareScope==='external_only'?'<span class="badge" style="color:#ffb7b2">'+(c.sharePolicyVersion==='v2_confirm_before_company_share'?'本人確認待ち':'外部のみ')+'</span>':c.shareScope==='confirm_first'?'<span class="badge" style="color:#ffe0a6">共有前確認</span>':c.shareScope==='summary_only'?'<span class="badge">要旨のみ</span>':'')+'</div><div class="meta">'+esc(new Date(c.receivedAt).toLocaleString('ja-JP'))+' / '+esc(c.identityMode==='named'?'記名':'匿名')+' / '+esc(subject(c.subjectLevel))+'</div></div>').join('');document.querySelectorAll('.case').forEach(el=>el.onclick=()=>{selected=el.dataset.id;renderList();renderDetail(cases.find(x=>x.consultationId===selected))})}
async function ensureJapaneseTranslation(c){
  if(!c||c.languageCode==='ja'||c.languageName==='日本語'||c.contentJa||translating.has(c.consultationId))return;
  translating.add(c.consultationId);
  try{
    const r=await fetch('/api/counsel-admin-translate',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({consultationId:c.consultationId})
    });
    const d=await r.json();
    if(r.ok&&d.record){
      Object.assign(c,d.record);
      renderDetail(c);
    }
  }catch(_){
    c.translationStatus='failed';
    renderDetail(c);
  }
  finally{translating.delete(c.consultationId)}
}
function renderDetail(c){if(!c)return;$('detail').innerHTML='<div class="caseId">'+esc(c.consultationId)+'</div><div class="row"><b>受付:</b> '+esc(new Date(c.receivedAt).toLocaleString('ja-JP'))+'</div><div class="row"><b>言語:</b> '+esc(c.languageName||c.languageCode)+'</div><div class="row"><b>相談方法:</b> '+esc(c.identityMode==='named'?'記名':'匿名')+(c.employeeName?' / '+esc(c.employeeName):'')+'</div><div class="row"><b>所属・現場:</b> '+esc(c.affiliation||'—')+'</div><div class="row"><b>相談対象:</b> '+esc(subject(c.subjectLevel))+'</div><div class="row"><b>相談の種類:</b> '+esc(consultationCategoryLabel(c.consultationCategory))+'</div><div class="row"><b>共有してほしくない相手:</b> '+esc((avoidTypeLabel(c.shareAvoidType)?avoidTypeLabel(c.shareAvoidType)+(c.shareAvoid?' / ':''):'')+(c.shareAvoid||'—'))+'</div><div class="row"><b>共有範囲:</b> '+esc(shareScopeLabel(c.shareScope,c.sharePolicyVersion))+'</div>'+((c.shareScope==='external_only'&&c.sharePolicyVersion==='v2_confirm_before_company_share')?'<div class="row" style="color:#ffb7b2"><b>重要:</b> 現時点では会社側へ共有しない。会社対応が必要な場合は、原則として相談者本人に確認してから共有する。</div>':'')+((c.shareScope==='external_only'&&c.sharePolicyVersion!=='v2_confirm_before_company_share')?'<div class="row" style="color:#ffb7b2"><b>重要:</b> 旧設定の相談。会社側へ共有しない。外部相談対応者内で留める。</div>':'')+((c.shareScope==='confirm_first')?'<div class="row" style="color:#ffe0a6"><b>重要:</b> 他者へ共有する前に相談者本人への確認が必要。</div>':'')+((c.shareScope==='summary_only')?'<div class="row" style="color:#d8eadf"><b>共有時:</b> 原文ではなく要旨のみ使用する。</div>':'')+'<div class="row"><b>対応状況:</b> <select id="status" class="status"><option>未確認</option><option>確認済</option><option>対応中</option><option>対応済</option></select></div>'
  +'<div class="handlingBox"><b>対応判断</b><label>対応区分</label><select id="handlingType"><option value="">未判断</option><option value="priority_action">優先確認・対応</option><option value="fact_check">事実確認・会社判断</option><option value="advice_coordination">助言・調整</option><option value="org_improvement">組織改善として検討</option><option value="record_opinion">意見として記録</option><option value="out_of_scope">対応対象外</option></select><label>判断理由・対応しない場合の理由</label><textarea id="handlingReason" placeholder="なぜこの対応区分にしたかを記録"></textarea><label>対応メモ・次に行うこと</label><textarea id="handlingNote" placeholder="確認事項、調整内容、次のアクションなど"></textarea><button id="saveHandling" class="btn saveHandling">対応判断を保存</button><div id="handlingErr" class="err"></div><div id="handlingHistory" class="history"></div></div>'
  +'<div class="row" style="margin-top:18px"><b>相談内容（原文）</b></div><div class="content">'+esc(c.content)+'</div>'
  +(c.contentJa&&c.contentJa!==c.content?'<div class="row" style="margin-top:12px"><b>相談内容（日本語訳）</b></div><div class="content">'+esc(c.contentJa)+'</div>':'')
  +(c.improveIdea?'<div class="row" style="margin-top:18px"><b>あなたはどうすればよくなると考えるか（原文）</b></div><div class="content">'+esc(c.improveIdea)+'</div>':'')
  +(c.improveIdeaJa&&c.improveIdeaJa!==c.improveIdea?'<div class="row" style="margin-top:12px"><b>どうすればよくなると考えるか（日本語訳）</b></div><div class="content">'+esc(c.improveIdeaJa)+'</div>':'')
  +(c.selfAction?'<div class="row" style="margin-top:18px"><b>あなたにできることは何か（原文）</b></div><div class="content">'+esc(c.selfAction)+'</div>':'')
  +(c.selfActionJa&&c.selfActionJa!==c.selfAction?'<div class="row" style="margin-top:12px"><b>あなたにできること（日本語訳）</b></div><div class="content">'+esc(c.selfActionJa)+'</div>':'')
  +((c.languageCode&&c.languageCode!=='ja'&&!c.contentJa&&c.translationStatus!=='failed')?'<div class="row" style="margin-top:12px;color:#d8eadf"><b>日本語訳：</b>生成中…</div>':'')
  +((c.languageCode&&c.languageCode!=='ja'&&!c.contentJa&&c.translationStatus==='failed')?'<div class="row" style="margin-top:12px;color:#ffb7b2"><b>日本語訳：</b>生成できませんでした。<button id="retryTranslation" class="btn refresh" style="margin-left:8px;padding:6px 10px">再翻訳</button></div>':''); $('status').value=c.status||'未確認';
  $('handlingType').value=c.handlingType||'';
  $('handlingReason').value=c.handlingReason||'';
  $('handlingNote').value=c.handlingNote||'';
  const hist=Array.isArray(c.handlingHistory)?c.handlingHistory.slice(-5).reverse():[];
  $('handlingHistory').textContent=hist.length?'直近の判断履歴\n'+hist.map(x=>new Date(x.at).toLocaleString('ja-JP')+' / '+handlingTypeLabel(x.type)+(x.reason?'\n理由: '+x.reason:'')+(x.note?'\nメモ: '+x.note:'')).join('\n\n'):'';
  ensureJapaneseTranslation(c);
  const retry=$('retryTranslation');if(retry)retry.onclick=()=>{c.translationStatus='';ensureJapaneseTranslation(c)};
  $('status').onchange=async()=>{const status=$('status').value;const r=await fetch('/api/counsel-admin-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consultationId:c.consultationId,status})});if(r.ok){c.status=status;renderList()}};
  $('saveHandling').onclick=async()=>{
    $('handlingErr').textContent='';
    const handlingType=$('handlingType').value;
    const handlingReason=$('handlingReason').value.trim();
    const handlingNote=$('handlingNote').value.trim();
    if(handlingType==='out_of_scope'&&!handlingReason){$('handlingErr').textContent='対応対象外にする場合は、理由を入力してください。';return}
    const r=await fetch('/api/counsel-admin-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({consultationId:c.consultationId,handlingType,handlingReason,handlingNote})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){$('handlingErr').textContent=d.error||'保存できませんでした。';return}
    c.handlingType=handlingType;c.handlingReason=handlingReason;c.handlingNote=handlingNote;
    if(Array.isArray(d.handlingHistory))c.handlingHistory=d.handlingHistory;
    renderDetail(c);
  }}
$('loginBtn').onclick=login;$('pin').onkeydown=e=>{if(e.key==='Enter')login()};$('refresh').onclick=()=>{const u=new URL(location.href);u.searchParams.set('v',Date.now().toString());location.replace(u.toString())};load();
</script></body></html>
