<!-- 元の Rac AI面接 v2.23 を保持したまま、</body> の直前に貼り付ける -->

<style id="hiragumi-role-style">
#hiragumi-role-presets{background:linear-gradient(145deg,#102b44,#31516a);border-radius:16px;color:#fff;padding:18px 18px 16px;margin:24px 0 16px;box-shadow:0 8px 25px #102d4315}
#hiragumi-role-presets h3{margin:3px 0 7px;color:white;font-size:18px}
#hiragumi-role-presets p{margin:5px 0 12px;font-size:12px;line-height:1.7;color:#dbe6ed}
#hiragumi-role-presets .hg-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
#hiragumi-role-presets .hg-choice{border:1px solid #c0d2e0;background:#ffffff10;border-radius:10px;color:white;padding:11px 9px;text-align:left;font-size:13px;font-weight:700;cursor:pointer}
#hiragumi-role-presets .hg-choice[aria-pressed="true"]{background:#f1cf92;color:#172839;border-color:#f1cf92;box-shadow:inset 0 0 0 1px #a88147}
#hiragumi-role-presets .hg-choice span{font-size:10px;opacity:.78;display:block;margin-bottom:3px}
#hiragumi-role-presets .hg-chosen{font-size:12px;margin-top:11px;line-height:1.8;color:#f4dbac}
#hiragumi-role-presets .hg-note{font-size:11px;color:#bed5e4;margin-top:8px}
@media(max-width:620px){#hiragumi-role-presets .hg-options{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:350px){#hiragumi-role-presets .hg-options{grid-template-columns:1fr}}
</style>
<script id="hiragumi-role-injection">
(function(){
"use strict";
var ROLES=[
{id:"ashiba",group:"仮設工事",name:"足場組立解体技術職",
 job:"平組の主力事業である仮設足場の組立・解体。戸建・低層から中高層の現場で仲間と安全に作業する。仕事の理解、安全確認、声掛け、協力、指示を確認してから作業を行う姿勢が必要。面接では志望動機・安全上の判断・先輩とのコミュニケーション・未経験の場合の学び方を確認する。想定場面：安全確認が不十分な仲間を発見したとき、経験者の指示でも不安を感じたときにどう対応するか。"},
{id:"civil",group:"土工・重機",name:"土工・重機オペレーター職",
 job:"整地、基礎床掘、生コン打設などの土工業務と重機の操作・補助。資格、作業条件、誘導員との連携、周囲の安全確認、分からない作業では必ず確認することが重要。面接では作業内容への理解、安全管理、資格取得への意欲、チーム内連携、経験の有無に応じた判断を確認する。想定場面：予定が遅れている状態で作業経験のない重機を任されたらどうするか。"},
{id:"driver",group:"配送・運転",name:"8t・4tユニック運転技術職",
 job:"平組の仮設資機材を現場まで運ぶ8t・4tユニック運転・配送と積込み荷下ろし、現場支援。車両や業務に必要な免許・資格は正式な求人票で確認が必要。安全運転、積荷の固定、時間の見通し、出発前点検、現場との報告連絡を重視する。面接では配送への志望動機、安全と納期の両立、到着遅延や積載不安時の報告・判断を確認する。"},
{id:"warehouse",group:"倉庫・資機材",name:"倉庫管理技術職",
 job:"仮設資機材センターにおける資機材の出入庫、数量確認、準備、整理整頓、配送や現場との連携。正確な数量管理、損傷点検、優先順位づけ、現場からの急な依頼の調整を重視する。面接では正確性、段取り、報告、資機材の不足・誤出庫に気づいた場合の対応を確認する。想定場面：複数現場の緊急依頼が重なり必要資材が不足したらどうするか。"},
{id:"office",group:"総務・管理",name:"総務事務職",
 job:"平組の社内事務、書類・情報管理、部署との連絡調整を想定する職種。実際の担当範囲は募集要項で確認が必要。期限・正確性・個人情報や社内情報の取扱い、複数の依頼の優先順位、ミス発見時の報告と改善が重要。面接では事務職の志望動機、確認を重ねる姿勢、周囲との調整力、情報管理の意識を確認する。"},
{id:"sales",group:"営業・提案",name:"営業技術職",
 job:"平組の建設関連営業、顧客対応、見積作成、現場・社内との連携を想定する職種。実際の役割は募集要項で確認が必要。顧客要望の正確な把握、見積の確認、工期や施工条件の社内調整、約束できないことを安易に確約しない姿勢が重要。面接では営業志望動機、顧客との信頼関係、現場と異なる要望が出た場合の調整や報告を確認する。"}
];
function ready(){
 var job=document.getElementById("jobTitle"),desc=document.getElementById("jobDescription"),form=document.querySelector("#setup .form-grid");
 if(!job||!desc||!form)return;
 if(document.getElementById("hiragumi-role-presets"))return;
 var panel=document.createElement("section");panel.id="hiragumi-role-presets";panel.setAttribute("aria-label","平組の希望職種を選択");
 var title=document.createElement("h3");title.textContent="平組の希望職種を選ぶ";panel.appendChild(title);
 var info=document.createElement("p");info.textContent="平組6職種から選択すると、既存AI面接の「希望職種」と「仕事内容」に自動反映します。面接官の顔・声・難易度・回答方式は従来どおり選べます。";panel.appendChild(info);
 var grid=document.createElement("div");grid.className="hg-options";grid.setAttribute("role","group");grid.setAttribute("aria-label","希望職種");panel.appendChild(grid);
 var chosen=document.createElement("div");chosen.className="hg-chosen";panel.appendChild(chosen);
 var note=document.createElement("p");note.className="hg-note";note.textContent="既存v2.23の無料3問テストを使用します。職種情報は質問分岐用の参考資料であり、正式な求人内容は企業にご確認ください。";panel.appendChild(note);
 form.parentNode.insertBefore(panel,form);
 function changed(el){el.dispatchEvent(new Event("input",{bubbles:true}));el.dispatchEvent(new Event("change",{bubbles:true}))}
 function choose(roleId){
  var p=ROLES.find(function(r){return r.id===roleId})||ROLES[0];
  job.value=p.name;desc.value=p.job;
  changed(job);changed(desc);
  chosen.textContent="選択中："+p.name+"（職種と仕事内容を自動入力しました）";
  grid.querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.role===p.id))});
  try{history.replaceState(null,"",location.pathname+"?role="+encodeURIComponent(p.id))}catch(e){}
 }
 ROLES.forEach(function(p){
  var b=document.createElement("button");b.type="button";b.className="hg-choice";b.dataset.role=p.id;
  var cat=document.createElement("span");cat.textContent=p.group;b.appendChild(cat);
  b.appendChild(document.createTextNode(p.name));b.addEventListener("click",function(){choose(p.id)});grid.appendChild(b)
 });
 var params=new URLSearchParams(location.search);
 choose(params.get("role")||params.get("job")||"ashiba");
 // The original setup is kept intact; inputs remain user-editable and the original start handler is unchanged.
}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",ready);else ready();
})();
</script>
