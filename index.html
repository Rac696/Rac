<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rac AI音声面接デモ</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:680px;margin:auto;padding:18px;background:#0b0d10;color:#fff}h1{font-size:26px;margin:8px 0}.sub{color:#aeb7c0;font-size:13px;line-height:1.7}.card{background:#15191e;border:1px solid #2b333d;border-radius:18px;padding:16px;margin-top:16px}.q{padding:16px;background:#1c2229;border-radius:14px;line-height:1.7;font-size:17px}.status{margin:12px 0;color:#b9c3cc;font-size:13px}.mic{width:100%;padding:15px;border:0;border-radius:13px;font-size:17px;font-weight:800;background:#fff;color:#111}.mic.on{background:#b42318;color:#fff}.send{width:100%;padding:14px;border:1px solid #38434d;border-radius:13px;font-size:16px;font-weight:700;background:#242b32;color:#fff;margin-top:10px}.send:disabled{opacity:.45}.answer{margin-top:12px;padding:14px;background:#0f1419;border:1px solid #29323a;border-radius:12px;min-height:64px;line-height:1.7}.hidden{display:none}.small{font-size:11px;color:#89949e;line-height:1.6;margin-top:10px}input{width:100%;padding:13px;font-size:16px;border-radius:12px;border:1px solid #333;background:#0f1419;color:#fff;box-sizing:border-box}.start{width:100%;padding:15px;margin-top:12px;border:0;border-radius:13px;font-size:17px;font-weight:800;background:#fff;color:#111}</style></head><body><div style="font-size:11px;letter-spacing:.12em;color:#bbc3ca">RAC SOLUTION / VOICE INTERVIEW</div><h1>AI音声一次面接</h1><div class="sub">AIが質問を読み上げます。応募者はマイクに向かって回答してください。試作版のため回答内容は外部へ送信しません。</div><div id="start" class="card"><div style="font-weight:800;font-size:20px">土木作業員</div><div class="sub">南州建設株式会社</div><input id="name" placeholder="お名前"><button class="start" onclick="begin()">音声面接を開始</button><div class="small">iPhoneではSafariで開いてください。初回はマイク利用の許可が表示されます。</div></div><div id="interview" class="card hidden"><div id="count" class="sub"></div><div id="question" class="q"></div><div id="status" class="status">質問を読み上げています…</div><button id="mic" class="mic" onclick="toggleMic()">🎙 話して回答</button><div id="answer" class="answer">ここに音声認識した回答が表示されます。</div><button id="send" class="send" onclick="next()" disabled>この回答で次へ</button><button class="send" onclick="speakCurrent()">🔊 質問をもう一度聞く</button><div class="small">音声認識が使えない場合は、Safariのマイク許可とSiriが有効か確認してください。</div></div><div id="done" class="card hidden"><h2>面接終了</h2><p class="sub">ご回答ありがとうございました。試作版ではここまでです。本番版では回答をAIが分析し、内容に応じて追加質問を生成します。</p><div id="summary"></div></div><script>const qs=['まず、南州建設株式会社の土木作業員に応募しようと思った理由を教えてください。','これまでの仕事経験について教えてください。現場作業や体を動かす仕事の経験があれば、その内容もお願いします。','朝が早い勤務や、暑さ寒さのある屋外作業について、どのように考えていますか？','現場では安全ルールや上司の指示が重要です。納得できない指示があった場合、あなたならどうしますか？','通勤方法と通勤時間、入社できる時期を教えてください。'];let i=0,answers=[],rec=null,listening=false,latest='';function begin(){if(!document.getElementById('name').value.trim())return alert('お名前を入力してください');document.getElementById('start').classList.add('hidden');document.getElementById('interview').classList.remove('hidden');setupRecognition();render();setTimeout(speakCurrent,300)}function setupRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('status').textContent='このブラウザでは音声認識が利用できません。Safariで開いてください。';document.getElementById('mic').disabled=true;return}rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=false;rec.onstart=()=>{listening=true;document.getElementById('mic').classList.add('on');document.getElementById('mic').textContent='● 聞き取り中… タップで終了';document.getElementById('status').textContent='話してください';latest=''};rec.onresult=e=>{let finalText='',interim='';for(let k=e.resultIndex;k<e.results.length;k++){let t=e.results[k][0].transcript;if(e.results[k].isFinal)finalText+=t;else interim+=t}latest=(finalText||latest)+interim;document.getElementById('answer').textContent=latest||'聞き取っています…';document.getElementById('send').disabled=!latest.trim()};rec.onend=()=>{listening=false;document.getElementById('mic').classList.remove('on');document.getElementById('mic').textContent='🎙 もう一度話す';document.getElementById('status').textContent=latest?'回答を確認してください':'音声をうまく認識できませんでした。もう一度お試しください。'};rec.onerror=e=>{document.getElementById('status').textContent='音声認識エラー: '+e.error}}function render(){document.getElementById('count').textContent='質問 '+(i+1)+' / '+qs.length;document.getElementById('question').textContent=qs[i];document.getElementById('answer').textContent='ここに音声認識した回答が表示されます。';document.getElementById('send').disabled=true;latest=''}function speakCurrent(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(qs[i]);u.lang='ja-JP';u.rate=.95;u.pitch=1;u.onstart=()=>document.getElementById('status').textContent='AIが質問を読み上げています…';u.onend=()=>document.getElementById('status').textContent='「話して回答」を押して、マイクに向かってお答えください。';speechSynthesis.speak(u)}function toggleMic(){if(!rec)return;if(listening){rec.stop();return}speechSynthesis.cancel();try{rec.start()}catch(e){}}function next(){if(!latest.trim())return;answers.push(latest.trim());i++;if(i<qs.length){render();setTimeout(speakCurrent,250)}else finish()}function finish(){speechSynthesis.cancel();document.getElementById('interview').classList.add('hidden');document.getElementById('done').classList.remove('hidden');document.getElementById('summary').innerHTML=answers.map((a,j)=>'<div class="answer"><b>Q'+(j+1)+'</b><br>'+esc(a)+'</div>').join('');let u=new SpeechSynthesisUtterance('以上で一次面接は終了です。ご回答ありがとうございました。');u.lang='ja-JP';speechSynthesis.speak(u)}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
