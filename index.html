<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rac 面接デモ</title></head><body style="font-family:sans-serif;max-width:680px;margin:auto;padding:20px;background:#111;color:#fff"><h1>Rac AI面接デモ</h1><p>南州建設株式会社｜土木作業員</p><div id="app"><p>スマホで面接の流れを確認する試作です。</p><input id="name" placeholder="お名前" style="width:100%;padding:12px;font-size:16px"><button onclick="start()" style="width:100%;padding:14px;margin-top:12px;font-size:16px">開始</button></div><script>const q=['応募した理由を教えてください。','これまでの仕事経験を教えてください。','屋外作業についてどう考えていますか？','安全ルールを守るために意識していることはありますか？','通勤方法と入社可能時期を教えてください。'];let i=0,a=[];function start(){let n=document.getElementById('name').value.trim();if(!n)return;show()}function show(){document.getElementById('app').innerHTML='<h2>質問 '+(i+1)+' / '+q.length+'</h2><p style="padding:16px;background:#222;border-radius:12px;line-height:1.6">'+q[i]+'</p><textarea id="ans" style="width:100%;min-height:130px;padding:12px;font-size:16px"></textarea><button onclick="next()" style="width:100%;padding:14px;margin-top:12px;font-size:16px">回答を送る</button>'}function next(){let v=document.getElementById('ans').value.trim();if(!v)return;a.push(v);i++;if(i<q.length)show();else done()}function done(){document.getElementById('app').innerHTML='<h2>面接終了</h2><p>ご回答ありがとうございました。</p>'+a.map((x,j)=>'<div style="margin:12px 0;padding:12px;background:#222;border-radius:12px"><b>Q'+(j+1)+'</b><br>'+x+'</div>').join('')}</script></body></html>
